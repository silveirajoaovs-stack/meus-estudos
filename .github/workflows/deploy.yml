# Publica o site no GitHub Pages a cada push na branch main.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Valores públicos por natureza (vão no JavaScript do site); os dados são protegidos pelo RLS.
          VITE_SUPABASE_URL: https://kahshdetybqzwigyachv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_lWkoD_I19eUF5ywegosVAg_HPaFHmQr
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
